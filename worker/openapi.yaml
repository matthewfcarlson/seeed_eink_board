openapi: 3.0.3
info:
  title: E-Ink Board Worker API
  version: "1.0"
  description: |
    API for the Cloudflare Worker backing the EE02 e-ink display boards.

    Two very different kinds of clients call this API:

    - **Admin clients** (you, from a browser, curl, Postman, etc.) — everything
      under `/admin/*` plus `GET /current`. Authenticate with
      `Authorization: Bearer <api_key>`. Get a key by completing passkey
      registration (`/auth/register/*`) or by copying it from the admin UI at
      `/admin` ("Rotate API Key").
    - **Devices** (the ESP32 firmware) — `/device_config`, `/hash`,
      `/image_packed`, `/firmware_bin`. These use a different, HMAC-based
      per-request signature (`X-Device-MAC` / `X-Device-Nonce` /
      `X-Device-Signature`), not the Bearer key. Documented here for
      completeness but you won't normally call these by hand.

    Import this file into Postman/Insomnia/Swagger UI, set the `bearerAuth`
    security value to your API key, and every `/admin/*` request (including
    `GET /current`) is one click away.
servers:
  - url: https://{host}
    variables:
      host:
        default: localhost:8787
        description: Your deployed worker's hostname (or a local `wrangler dev` host:port).
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Your account's API key, minted by /auth/register/verify,
        /auth/login/verify, or POST /admin/keys/rotate.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    WrappedKey:
      type: object
      description: >-
        An ECIES-wrapped copy of a bucket's AES-256-GCM key for one principal
        (a user or device) — see root CLAUDE.md's encrypted-buckets plan. The
        Worker only ever stores and returns this ciphertext; it cannot unwrap
        it (that needs the recipient's private key, which never leaves their
        browser or device).
      properties:
        ephemeral_pub: { type: string, description: base64, raw uncompressed P-256 point }
        nonce: { type: string, description: base64, 12 bytes }
        ciphertext: { type: string, description: base64 }
      required: [ephemeral_pub, nonce, ciphertext]
    Bucket:
      type: object
      properties:
        id:
          type: string
        owner_id:
          type: string
          nullable: true
        label:
          type: string
        created_at:
          type: integer
        is_owner:
          type: boolean
        is_public:
          type: boolean
          description: >-
            Whether this bucket is readable (never writable) by every
            account, not just its owner/collaborators — see
            migrations/0018_public_buckets.sql. Settable only by a superuser,
            via POST /admin/buckets or PATCH /admin/buckets/{id}.
        key_version:
          type: integer
          description: >-
            The bucket's current AES-256-GCM key version — see
            migrations/0016_bucket_key_rotation.sql. Starts at 1; bumped only
            by POST /admin/buckets/{id}/rotate/{rotationId}/finalize.
        key:
          allOf: [{ $ref: '#/components/schemas/WrappedKey' }]
          nullable: true
          description: >-
            The caller's own wrapped copy of this bucket's key, AT key_version
            above. Null if this principal was dropped mid-rotation and never
            re-wrapped (see rotate/finalize), OR if this bucket is only
            visible to the caller because it's public and they hold no
            personal wrap for it — see public_key_raw below for that case.
        public_key_raw:
          type: string
          nullable: true
          description: >-
            The bucket's raw, UNWRAPPED AES-256-GCM key, base64 — the
            deliberate escape hatch from the normal per-principal-wrapped-key
            model for a public bucket (migrations/0018_public_buckets.sql):
            there's no recipient public key to ECIES-wrap against for
            "anyone with an account", so a public bucket's key just isn't
            kept secret. Every image byte is still exactly as
            AES-256-GCM-encrypted under it as any other bucket's — only the
            key distribution differs. Only ever non-null when is_public is
            true, and even then ONLY surfaced to a caller who has no personal
            `key` for this bucket (an owner or collaborator always uses their
            own `key` instead, even on a bucket that's also public).
    Image:
      type: object
      properties:
        id:
          type: string
        filename:
          type: string
        dither_algorithm:
          type: string
          enum: [floyd_steinberg, atkinson, ordered, none]
        packed_hash:
          type: string
        packed_bytes:
          type: integer
        raw_bytes:
          type: integer
        created_at:
          type: integer
        key_version:
          type: integer
          description: >-
            Which of the bucket's key versions this image's three KV blobs are
            actually encrypted under right now — see
            migrations/0016_bucket_key_rotation.sql. Lags the bucket's own
            key_version between a rotation's start and this image's
            reencrypt-image call.
        thumbnail_ciphertext_b64:
          type: string
          nullable: true
          description: >-
            Base64 of the AES-256-GCM-encrypted thumbnail (12-byte nonce
            prepended). The dashboard decrypts this client-side with the
            bucket key — it is not a renderable data URL on its own.
    Device:
      type: object
      properties:
        mac:
          type: string
        label:
          type: string
          nullable: true
        created_at:
          type: integer
        last_seen_at:
          type: integer
          nullable: true
        last_seen_ip:
          type: string
          nullable: true
        last_battery_voltage:
          type: number
          nullable: true
        last_battery_at:
          type: integer
          nullable: true
        running_firmware_version:
          type: string
          nullable: true
        board:
          type: string
          nullable: true
          description: >-
            Self-reported via X-Device-Board (e.g. `ee02-13in3`, `ee04-7in3`).
            Null until the device's first successful request.
        sharing_public_key:
          type: string
          nullable: true
          description: >-
            Base64, this device's raw P-256 public key — self-reported via
            X-Device-Sharing-Public-Key the same way as board. Required before
            a bucket can be assigned to this device (see
            PATCH /admin/devices/{mac}/buckets).
        bucket_ids:
          type: array
          items:
            type: string
        current_image:
          type: object
          nullable: true
          properties:
            id:
              type: string
              nullable: true
            filename:
              type: string
            source_bucket_id:
              type: string
              nullable: true
              description: Which bucket's key decrypts thumbnail_ciphertext_b64 — a device can subscribe to several.
            thumbnail_ciphertext_b64:
              type: string
              nullable: true
    ScheduleConfig:
      type: object
      properties:
        refresh_interval_minutes:
          type: integer
          minimum: 1
          maximum: 1440
        active_start_hour:
          type: integer
          minimum: 0
          maximum: 23
        active_end_hour:
          type: integer
          minimum: 0
          maximum: 23
        timezone_offset_minutes:
          type: integer
          minimum: -720
          maximum: 840
    DeviceStatus:
      type: object
      properties:
        device_id:
          type: string
        current_image:
          type: string
          nullable: true
        pending_image:
          type: string
          nullable: true
        total_images:
          type: integer
        schedule_config:
          $ref: '#/components/schemas/ScheduleConfig'
        config_source:
          type: string
        battery:
          type: object
          nullable: true
          properties:
            voltage:
              type: number
            updated_at:
              type: integer
              nullable: true
  parameters:
    XDeviceMac:
      name: X-Device-MAC
      in: header
      required: true
      schema:
        type: string
      description: Device MAC address, no separators (e.g. `d0cf1326f7e8`).
    XDeviceBoard:
      name: X-Device-Board
      in: header
      required: false
      schema:
        type: string
      description: >-
        Compiled-in board id (e.g. `ee02-13in3`, `ee04-7in3`) — same string
        used for the GitHub release asset name and firmware_releases.board.
        Only absent for firmware older than this header's introduction; when
        absent, /device_config omits firmware_version/firmware_sha256 rather
        than guessing which board's release to resolve.
    XDeviceSharingPublicKey:
      name: X-Device-Sharing-Public-Key
      in: header
      required: false
      schema:
        type: string
      description: >-
        Base64 of this device's raw uncompressed P-256 public key, generated
        on-device on first boot (see device_app.h's ensureSharingKeyPair()) and
        self-reported the same way as X-Device-Board — never pushed through a
        separate provisioning flow. Recorded onto devices.sharing_public_key so
        an owner's browser can wrap a bucket key for this device (see root
        CLAUDE.md's encrypted-buckets plan).
    MacPath:
      name: mac
      in: path
      required: true
      schema: { type: string }
      description: Device MAC address, no separators (e.g. `d0cf1326f7e8`).
    BucketIdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
    ImageIdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
    TargetPath:
      name: target
      in: path
      required: true
      schema: { type: string }
      description: >-
        A device MAC owned by the caller. There is no shared `default`/`global`
        tier — every schedule override and firmware target is per-device.
paths:
  /current:
    get:
      summary: Device status (your own devices only)
      description: >-
        Debug/status view. Requires an admin API key and only ever returns
        devices you own. With no `device` query param / X-Device-MAC header,
        returns every device belonging to the caller.
      parameters:
        - name: device
          in: query
          schema:
            type: string
          description: MAC of a specific device to look up (alternative to X-Device-MAC).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DeviceStatus'
                  - type: object
                    properties:
                      devices:
                        type: object
                        additionalProperties:
                          $ref: '#/components/schemas/DeviceStatus'
                      total_devices:
                        type: integer
        '401':
          description: Missing/invalid API key
        '403':
          description: Device belongs to another user
        '404':
          description: Device not found

  /admin/me:
    get:
      summary: Get the logged-in account
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  display_name: { type: string, nullable: true }
                  is_superuser:
                    type: boolean
                    description: >-
                      Manually flipped in D1 by the project owner — see
                      migrations/0018_public_buckets.sql for the exact
                      command. There is no API to set this. Gates only
                      whether this account may mark a bucket it owns
                      is_public; the client uses it to decide whether to show
                      the "Make this public" checkbox at all.
    patch:
      summary: Set your display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, maxLength: 40 }
              required: [display_name]
      responses:
        '200':
          description: OK

  /admin/keys/rotate:
    post:
      summary: Rotate your API key
      description: Invalidates the current key. The new key is returned exactly once.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key: { type: string }

  /admin/devices:
    get:
      summary: List your devices
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }
    post:
      summary: Register or update a device
      description: >-
        `secret` is required the first time a given MAC is claimed (proof of
        possession — every board shares the same vendor OUI, so a MAC alone is
        guessable/enumerable, not a secret) — from the registration QR code, or
        from the BLE provisioning INFO characteristic while the device is
        unclaimed. Not required for a device this account already owns (label
        edits, etc.).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mac: { type: string }
                label: { type: string }
                secret:
                  type: string
                  description: >-
                    Hex device secret, required when claiming a MAC this
                    account doesn't already own. From the registration QR code
                    or BLE provisioning's INFO characteristic.
              required: [mac]
      responses:
        '201':
          description: Created/updated
        '400':
          description: Missing mac, or missing/malformed secret when claiming a new MAC
        '409':
          description: MAC already registered to another user

  /admin/devices/{mac}:
    patch:
      summary: Rename a device
      parameters:
        - $ref: '#/components/parameters/MacPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
      responses:
        '200': { description: OK }
        '403': { description: Forbidden }
        '404': { description: Not found }
    delete:
      summary: Unregister a device
      description: >-
        Deletes the device row and its bucket subscriptions. Its images are
        untouched. Until re-claimed, requests bearing this MAC get a
        "scan to register" QR code, never bucket content.
      parameters:
        - $ref: '#/components/parameters/MacPath'
      responses:
        '200': { description: Deleted }
        '403': { description: Forbidden }
        '404': { description: Not found }

  /admin/devices/{mac}/buckets:
    patch:
      summary: Replace a device's bucket subscriptions
      parameters:
        - $ref: '#/components/parameters/MacPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bucket_ids:
                  type: array
                  items: { type: string }
                keys:
                  type: object
                  description: >-
                    Map of bucket_id -> WrappedKey, the caller's own wrap of
                    each bucket's key for this device's public key. Required
                    for every id in bucket_ids. For a bucket the caller only
                    has read access to via is_public (see
                    migrations/0018_public_buckets.sql), the raw key wrapped
                    here comes from that bucket's public_key_raw instead of a
                    personal bucket_keys row — same wrapKeyFor call either
                    way, so this endpoint can't tell (and doesn't need to)
                    which source a given entry came from.
                  additionalProperties: { $ref: '#/components/schemas/WrappedKey' }
              required: [bucket_ids, keys]
      responses:
        '200': { description: OK }
        '400': { description: Missing a required wrapped key for one of the bucket ids }
        '403':
          description: >-
            Forbidden — device not yours, or no READ access (owned, shared,
            or public) to one of the bucket ids.
        '404': { description: Device not found }

  /admin/buckets:
    get:
      summary: List buckets you own, collaborate on, or that are public
      description: >-
        Every public bucket (migrations/0018_public_buckets.sql) is included
        alongside your owned/shared buckets, deduplicated. For a bucket
        you're only seeing because it's public, `key` is null and
        `public_key_raw` carries the bucket's raw AES key instead — see the
        Bucket schema.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  buckets:
                    type: array
                    items: { $ref: '#/components/schemas/Bucket' }
    post:
      summary: Create a bucket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                key:
                  allOf: [{ $ref: '#/components/schemas/WrappedKey' }]
                  description: The caller's wrap of the newly-generated bucket key for their own sharing_public_key.
                is_public:
                  type: boolean
                  description: >-
                    Create the bucket already public. Requires the caller to
                    be a superuser (see GET /admin/me's is_superuser) — 403
                    otherwise. Requires public_key_raw to also be set.
                public_key_raw:
                  type: string
                  description: >-
                    The newly-generated bucket key, raw and base64 (not
                    wrapped). Required when is_public is true; see the Bucket
                    schema's public_key_raw for why a public bucket's key
                    isn't kept secret at all.
              required: [label, key]
      responses:
        '201': { description: Created }
        '403': { description: is_public was true but the caller isn't a superuser }

  /admin/buckets/{id}:
    patch:
      summary: Rename a bucket and/or toggle its public flag (owner only)
      description: >-
        At least one of label/is_public must be present. Setting is_public
        requires the caller to be a superuser, same as creating a public
        bucket — this is how an owner makes an EXISTING bucket public (their
        browser already holds the raw key via its own wrapped copy, so it
        just uploads that as public_key_raw too) or takes one back private
        (which nulls out public_key_raw server-side).
      parameters:
        - $ref: '#/components/parameters/BucketIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                is_public: { type: boolean }
                public_key_raw:
                  type: string
                  description: The bucket's raw key, base64. Required when setting is_public to true.
      responses:
        '200': { description: OK }
        '400': { description: Neither label nor is_public was given, or public_key_raw was missing while setting is_public true }
        '403': { description: Not the owner, or is_public was set but the caller isn't a superuser }
        '404': { description: Not found }
    delete:
      summary: Delete a bucket (owner only)
      description: Deletes all images, subscriptions, shares, and invites for the bucket.
      parameters:
        - $ref: '#/components/parameters/BucketIdPath'
      responses:
        '200': { description: Deleted }
        '403': { description: Not the owner }
        '404': { description: Not found }

  /admin/buckets/{id}/invite:
    post:
      summary: Create/refresh a reusable invite link (owner only)
      parameters:
        - $ref: '#/components/parameters/BucketIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
    delete:
      summary: Revoke a bucket's invite link (owner only)
      parameters:
        - $ref: '#/components/parameters/BucketIdPath'
      responses:
        '200': { description: Revoked }

  /admin/buckets/join:
    post:
      summary: Join a bucket via invite token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                key:
                  allOf: [{ $ref: '#/components/schemas/WrappedKey' }]
                  description: >-
                    The joining client's own wrap of the raw bucket key it read
                    from the invite link's `#key=` URL fragment (never sent to
                    the server). Not required if the caller turns out to
                    already be the bucket's owner.
              required: [token]
      responses:
        '200': { description: OK }
        '400': { description: Missing key (required unless the caller is already the owner) }
        '404': { description: Invalid or revoked invite link }

  /admin/buckets/{id}/collaborators:
    get:
      summary: List a bucket's collaborators (owner only)
      parameters:
        - $ref: '#/components/parameters/BucketIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  collaborators:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        display_name: { type: string, nullable: true }
                        sharing_public_key:
                          type: string
                          nullable: true
                          description: >-
                            Base64 P-256 public key — needed client-side to
                            wrap a fresh bucket key for this collaborator
                            during POST rotate/{rotationId}/finalize.

  /admin/buckets/{id}/collaborators/{userId}:
    delete:
      summary: Remove a collaborator (owner only)
      parameters:
        - $ref: '#/components/parameters/BucketIdPath'
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Removed }

  /admin/buckets/{id}/rotate/start:
    post:
      summary: Start a bucket key rotation (owner only)
      description: >-
        See root CLAUDE.md's encrypted-buckets plan, "Known gaps: no
        crypto-level revocation." Mints key_version + 1: the caller supplies
        its own wrap of a freshly-generated key at that version (never sent
        raw), which the server stores immediately so a page reload can
        recover it via GET rotate/status and resume rather than losing the
        job. Returns the bucket's PRE-rotation key_version and every image id
        that still needs POST rotate/{rotationId}/reencrypt-image.
        At most one in-progress rotation per bucket — call GET rotate/status
        first if unsure.
      parameters:
        - $ref: '#/components/parameters/BucketIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  allOf: [{ $ref: '#/components/schemas/WrappedKey' }]
                  description: The caller's own wrap of a freshly-generated key, for key_version + 1.
              required: [key]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rotation_id: { type: string }
                  bucket_id: { type: string }
                  key_version: { type: integer, description: The bucket's key_version before this rotation. }
                  new_key_version: { type: integer }
                  image_ids:
                    type: array
                    items: { type: string }
        '400': { description: Missing or malformed key }
        '403': { description: Not the owner }
        '404': { description: Not found }
        '409': { description: A rotation is already in progress for this bucket }

  /admin/buckets/{id}/rotate/status:
    get:
      summary: Check a bucket's in-progress rotation, if any (owner only)
      description: >-
        Lets a client that closed its tab mid-rotation resume rather than
        starting a fresh one. `your_new_key` is the caller's own wrap of the
        new-version key (set at rotate/start, or backfilled for a principal
        added mid-rotation only at finalize) — unwrap it to recover the exact
        key needed to keep re-encrypting the remaining images.
      parameters:
        - $ref: '#/components/parameters/BucketIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  rotation:
                    type: object
                    nullable: true
                    description: Null when no rotation is in progress for this bucket.
                    properties:
                      id: { type: string }
                      key_version: { type: integer }
                      new_key_version: { type: integer }
                      created_at: { type: integer }
                      pending_image_ids: { type: array, items: { type: string } }
                      done_image_ids: { type: array, items: { type: string } }
                      your_new_key:
                        allOf: [{ $ref: '#/components/schemas/WrappedKey' }]
                        nullable: true
                  key_version:
                    type: integer
                    description: Present (instead of `rotation`) only when no rotation is in progress.
        '403': { description: Not the owner }
        '404': { description: Not found }

  /admin/buckets/{id}/rotate/{rotationId}/reencrypt-image/{imageId}:
    post:
      summary: Upload one image's re-encrypted ciphertext for an in-progress rotation (owner only)
      description: >-
        Same three-blob shape as /admin/images/upload (raw/packed/thumb
        ciphertext + a client-computed packed_hash), minus filename/
        device_key/dither_algorithm, which don't change. Overwrites the
        image's three KV blobs and bumps its key_version to the rotation's
        new_key_version. Idempotent — calling it again for an image already
        on the new version is a safe no-op (`already_migrated: true`, nothing
        rewritten).
      parameters:
        - $ref: '#/components/parameters/BucketIdPath'
        - name: rotationId
          in: path
          required: true
          schema: { type: string }
        - name: imageId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [raw, packed, thumb, packed_hash]
              properties:
                raw: { type: string, format: binary }
                packed: { type: string, format: binary }
                thumb: { type: string, format: binary }
                packed_hash: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  key_version: { type: integer }
                  already_migrated: { type: boolean }
        '400': { description: Missing or malformed field }
        '403': { description: Not the owner }
        '404': { description: Bucket, rotation, or image not found (or rotation already finalized) }

  /admin/buckets/{id}/rotate/{rotationId}/finalize:
    post:
      summary: Finalize a bucket key rotation (owner only)
      description: >-
        Refuses (409) unless every image in the bucket is confirmed on the
        rotation's new_key_version. The caller supplies a fresh wrap of the
        new key for every principal CURRENTLY authorized (owner + live
        bucket_shares + live device_buckets, recomputed here — not reused
        from rotate/start, so a share/device added mid-rotation is still
        included and one removed is not) — every key is required, or this
        fails closed with 400. On success: upserts those new-version
        bucket_keys rows, deletes every old-version bucket_keys row for this
        bucket (the actual revocation), and bumps buckets.key_version — all in
        one D1 batch.
      parameters:
        - $ref: '#/components/parameters/BucketIdPath'
        - name: rotationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_keys:
                  type: object
                  additionalProperties: { $ref: '#/components/schemas/WrappedKey' }
                  description: Keyed by user id. Must include every current owner/collaborator.
                device_keys:
                  type: object
                  additionalProperties: { $ref: '#/components/schemas/WrappedKey' }
                  description: Keyed by device MAC. Must include every currently-assigned device.
                public_key_raw:
                  type: string
                  description: >-
                    Required if (and only if) the bucket is public — the new
                    raw key, base64. Applied to buckets.public_key_raw in the
                    same batch that bumps key_version, so a public bucket's
                    non-owner readers (who hold no bucket_keys row at all —
                    see migrations/0018_public_buckets.sql) see the new key
                    immediately via GET /admin/buckets instead of being stuck
                    decrypting with the now-revoked old one.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  finalized: { type: boolean }
                  bucket_id: { type: string }
                  key_version: { type: integer }
        '400':
          description: >-
            Missing a required principal's wrapped key, or the bucket is
            public and public_key_raw was omitted.
        '403': { description: Not the owner }
        '404': { description: Not found, or rotation already finalized }
        '409': { description: Not every image has been re-encrypted yet }

  /admin/images:
    get:
      summary: List a bucket's images
      description: >-
        Read-shaped access: allowed for the owner, an accepted collaborator,
        OR anyone at all when the bucket is public
        (migrations/0018_public_buckets.sql) — see
        lib/bucket-access.ts's assertBucketReadAccess.
      parameters:
        - name: device_key
          in: query
          required: true
          description: The bucket id.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  images:
                    type: array
                    items: { $ref: '#/components/schemas/Image' }
        '403': { description: No read access to this bucket }

  /admin/images/upload:
    post:
      summary: Upload an already-encrypted image into a bucket
      description: >-
        Decode, EXIF-correct, crop, enhance, dither, pack, and AES-256-GCM-encrypt
        all run client-side now — see root CLAUDE.md's encrypted-buckets plan. This
        endpoint never sees plaintext: it stores three opaque ciphertext blobs
        (raw original, packed 4bpp, thumbnail) plus a client-computed content hash,
        gated by the same bucket-access check as before. `dither_algorithm` and
        `packed_hash` are trusted client-reported metadata — the Worker has no way
        to verify them without the bucket key.
      parameters:
        - name: device_key
          in: query
          required: true
          description: The bucket id to upload into.
          schema: { type: string }
        - name: filename
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [raw, packed, thumb, packed_hash]
              properties:
                raw: { type: string, format: binary, description: AES-256-GCM ciphertext (12-byte nonce prepended) of the original as-uploaded bytes }
                packed: { type: string, format: binary, description: AES-256-GCM ciphertext (12-byte nonce prepended) of the packed 4bpp buffer }
                thumb: { type: string, format: binary, description: AES-256-GCM ciphertext (12-byte nonce prepended) of the dashboard preview JPEG }
                dither_algorithm:
                  type: string
                  enum: [floyd_steinberg, atkinson, ordered]
                  default: floyd_steinberg
                packed_hash:
                  type: string
                  description: 16-char hex content hash, computed client-side over the packed ciphertext.
      responses:
        '201': { description: Uploaded }
        '400': { description: Missing or malformed field }
        '403':
          description: >-
            No WRITE access to this bucket — unlike GET /admin/images, being
            public is never enough on its own (see
            migrations/0018_public_buckets.sql: public buckets are
            read-only for everyone but the owner/collaborators).

  /admin/images/{id}:
    delete:
      summary: Delete an image
      parameters:
        - $ref: '#/components/parameters/ImageIdPath'
      responses:
        '200': { description: Deleted }
        '403': { description: No WRITE access to this bucket (see /admin/images/upload) }
        '404': { description: Not found }

  /admin/images/{id}/raw:
    get:
      summary: Fetch an image's original as-uploaded ciphertext
      description: >-
        Read-shaped access — same rule as GET /admin/images: allowed for the
        owner, an accepted collaborator, or anyone at all when the bucket is
        public (migrations/0018_public_buckets.sql).
      parameters:
        - $ref: '#/components/parameters/ImageIdPath'
      responses:
        '200':
          description: OK
          content:
            image/*: { schema: { type: string, format: binary } }
        '403': { description: No read access to this bucket }
        '404': { description: Not found }

  /admin/schedule/{target}:
    get:
      summary: Get a schedule override
      parameters:
        - $ref: '#/components/parameters/TargetPath'
      responses:
        '200': { description: OK }
        '403': { description: Forbidden }
    put:
      summary: Set a schedule override
      parameters:
        - $ref: '#/components/parameters/TargetPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleConfig' }
      responses:
        '200': { description: OK }
        '400': { description: Invalid values }
        '403': { description: Forbidden }
    delete:
      summary: Clear a schedule override
      parameters:
        - $ref: '#/components/parameters/TargetPath'
      responses:
        '200': { description: OK }
        '403': { description: Forbidden }

  /admin/firmware/sync:
    post:
      summary: Pull the latest GitHub release into the firmware catalog, per board
      description: >-
        Only catalogs the binaries (D1 + KV), one row per known board. Devices
        on the 'stable' channel start receiving a newly-synced release
        immediately on their next wake — there's no separate rollout step.
      responses:
        '200': { description: OK }
        '502': { description: GitHub fetch failed }

  /admin/firmware/releases:
    get:
      summary: List cataloged firmware releases
      description: >-
        Board-scoped: the same version tag can appear as one row per board
        (`ee02-13in3`, `ee04-7in3`, ...), each with its own sha256/binary.
        Informational only — devices don't target a specific row from here,
        see /admin/firmware/target/{target}.
      responses:
        '200': { description: OK }

  /admin/firmware/targets:
    get:
      summary: List each device's firmware channel
      responses:
        '200': { description: OK }

  /admin/firmware/target/{target}:
    put:
      summary: Set the firmware channel for a device MAC
      description: >-
        No admin-picked exact version — just a channel choice. 'stable'
        always resolves to the newest cataloged release for whatever board
        the device reports on each request; 'beta' currently resolves to
        nothing (no beta pipeline exists yet), same as no channel set.
      parameters:
        - $ref: '#/components/parameters/TargetPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel: { type: string, enum: [stable, beta] }
              required: [channel]
      responses:
        '200': { description: OK }
        '400': { description: channel must be 'stable' or 'beta' }
        '403': { description: Forbidden }
    delete:
      summary: Clear the firmware channel for a device MAC
      parameters:
        - $ref: '#/components/parameters/TargetPath'
      responses:
        '200': { description: OK }
        '403': { description: Forbidden }

  /admin/crash-reports:
    get:
      summary: List recent crash/rollback reports across the caller's devices
      description: Populated by POST /crash_report; pruned to the most recent 20 rows per device.
      responses:
        '200': { description: OK }

  /auth/register/options:
    post:
      summary: Start passkey registration (creates a new account)
      security: []
      responses:
        '200': { description: OK }

  /auth/register/verify:
    post:
      summary: Complete passkey registration
      description: >-
        The three sharing-key fields are optional and present as a set — only
        when this ceremony's authenticator returned a WebAuthn PRF result (see
        root CLAUDE.md's encrypted-buckets plan). `wrapped_sharing_key` is the
        client's P-256 sharing private key, AES-256-GCM-encrypted under a key
        derived from that PRF output — the Worker never sees the PRF output or
        the raw private key, only this ciphertext.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attemptId: { type: string }
                response: { type: object }
                sharing_public_key: { type: string, description: base64, raw P-256 public key }
                wrapped_sharing_key: { type: string, description: base64 }
                wrap_nonce: { type: string, description: base64, 12 bytes }
              required: [attemptId, response]
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key: { type: string }

  /auth/login/options:
    post:
      summary: Start passkey login
      security: []
      responses:
        '200': { description: OK }

  /auth/login/verify:
    post:
      summary: Complete passkey login
      description: >-
        Mints a fresh API key on every successful login. The response echoes
        back whatever sharing-key wrap is currently on file for this
        credential (possibly all null, if none has ever been established) so
        the client can unwrap its sharing private key using this exact
        ceremony's PRF output. If the client discovers it needs to backfill a
        wrap (no PRF-wrapped key existed yet, but this ceremony returned PRF
        output), it does so via a separate call to
        PATCH /admin/me/sharing-key using the api_key from this response —
        this ceremony's challenge is single-use and already consumed by the
        time that decision can be made.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attemptId: { type: string }
                response: { type: object }
              required: [attemptId, response]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key: { type: string }
                  sharing_public_key: { type: string, nullable: true }
                  wrapped_sharing_key: { type: string, nullable: true }
                  wrap_nonce: { type: string, nullable: true }

  /admin/me/sharing-key:
    patch:
      summary: Backfill this credential's PRF-wrapped sharing key
      description: >-
        See /auth/login/verify's description for why this is a separate,
        normally-authenticated endpoint rather than a field on that ceremony.
        A no-op (still 200) if this credential already has a wrap on file —
        guarded server-side, not by the client skipping the call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                credential_id: { type: string, description: The WebAuthn credential this PRF output came from. }
                sharing_public_key: { type: string }
                wrapped_sharing_key: { type: string }
                wrap_nonce: { type: string }
              required: [credential_id, sharing_public_key, wrapped_sharing_key, wrap_nonce]
      responses:
        '200': { description: OK (written, or already had a wrap on file) }
        '400': { description: Missing a required field }
        '404': { description: Unknown credential, or not this account's }

  /device_config:
    get:
      summary: "[Device-facing] Resolved schedule/firmware config for a device"
      description: >-
        Called by firmware, not admins. Unsigned if X-Device-MAC is omitted
        (returns global defaults); a present MAC for a registered device
        requires a valid X-Device-Nonce/X-Device-Signature. Each entry in the
        response's `bucket_keys` array now also carries `key_version` (see
        migrations/0016_bucket_key_rotation.sql) — mid-rotation a device can
        have two entries for the same `bucket_id`, one per version, and
        /image_packed's X-Bucket-Key-Version header says which to decrypt
        with for a given image.
      security: []
      parameters:
        - name: X-Device-MAC
          in: header
          schema: { type: string }
        - name: X-Device-Nonce
          in: header
          schema: { type: string }
        - name: X-Device-Signature
          in: header
          schema: { type: string }
        - name: X-Battery-Voltage
          in: header
          schema: { type: string }
        - name: X-Firmware-Version
          in: header
          schema: { type: string }
        - $ref: '#/components/parameters/XDeviceBoard'
        - $ref: '#/components/parameters/XDeviceSharingPublicKey'
      responses:
        '200': { description: OK }
        '401': { description: Invalid or missing device signature }

  /crash_report:
    post:
      summary: "[Device-facing] Report a crash and/or OTA rollback"
      description: >-
        Called by firmware/lib/common/ota_health.cpp + device_app.h's
        sendCrashReportIfPending(), at most once per boot, only after a device
        has already proven connectivity via /device_config this wake. Same
        auth as /device_config. An unclaimed device (unresolved X-Device-MAC)
        still gets a 200 so it stops retrying, but nothing is persisted.
      security: []
      parameters:
        - $ref: '#/components/parameters/XDeviceMac'
        - name: X-Device-Nonce
          in: header
          schema: { type: string }
        - name: X-Device-Signature
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firmware_version: { type: string }
                rolled_back: { type: boolean }
                reset_reason: { type: string }
                boot_attempts: { type: integer }
                crash_task: { type: string }
                crash_pc: { type: string }
                crash_cause: { type: integer }
                backtrace: { type: array, items: { type: string } }
                backtrace_corrupted: { type: boolean }
              required: [firmware_version, reset_reason]
      responses:
        '201': { description: Stored }
        '200': { description: Accepted but not stored (unclaimed device) }
        '400': { description: Missing X-Device-MAC or required body fields }
        '401': { description: Invalid or missing device signature }

  /hash:
    get:
      summary: "[Device-facing] 16-char hash of the pending image"
      description: Does not advance rotation. Requires X-Device-MAC (see /image_packed).
      security: []
      parameters:
        - $ref: '#/components/parameters/XDeviceMac'
        - name: X-Device-Nonce
          in: header
          schema: { type: string }
        - name: X-Device-Signature
          in: header
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            text/plain: { schema: { type: string } }
        '400': { description: X-Device-MAC header required }
        '401': { description: Invalid or missing device signature }
        '404': { description: No image available }

  /image_packed:
    get:
      summary: "[Device-facing] Fetch and advance to the next packed image"
      description: >-
        Returns the AES-256-GCM ciphertext (12-byte nonce prepended, 16-byte
        tag appended — see root CLAUDE.md's encrypted-buckets plan) of the
        packed 4bpp image data, and advances the rotation cursor. The
        plaintext is exactly 960,000 bytes; Content-Length here is 28 bytes
        larger. Requires X-Device-MAC — a request without it is rejected
        outright rather than falling back to any bucket's content (see
        migrations/0009_bucket_ownership.sql for why).
      security: []
      parameters:
        - $ref: '#/components/parameters/XDeviceMac'
        - name: X-Device-Nonce
          in: header
          schema: { type: string }
        - name: X-Device-Signature
          in: header
          schema: { type: string }
        - name: X-Device-Secret
          in: header
          schema: { type: string }
          description: Only sent by an unregistered device requesting its registration QR.
      responses:
        '200':
          description: OK
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
          headers:
            X-Bucket-Id:
              schema: { type: string }
              description: >-
                Which of this device's subscribed buckets the ciphertext is
                encrypted under — selects which of /device_config's
                bucket_keys entries to unwrap and decrypt with.
            X-Bucket-Key-Version:
              schema: { type: integer }
              description: >-
                Which of that bucket's key versions this specific image is
                encrypted under (see migrations/0016_bucket_key_rotation.sql).
                Mid-rotation a device can hold both an old and a new wrapped
                key for the same X-Bucket-Id, distinguished by this value —
                see /device_config's bucket_keys entries, each of which now
                also carries key_version.
        '400': { description: X-Device-MAC header required }
        '401': { description: Invalid or missing device signature }
        '404': { description: No images available }

  /firmware_bin:
    get:
      summary: "[Device-facing] Download a cataloged firmware binary"
      description: >-
        firmware_releases is keyed by (board, version) — the same version tag
        is deliberately reused across boards — so X-Device-Board is required
        here (unlike its optional use elsewhere) to disambiguate which
        board's binary to serve.
      security: []
      parameters:
        - name: version
          in: query
          required: true
          schema: { type: string }
        - name: X-Device-Board
          in: header
          required: true
          schema: { type: string }
          description: >-
            Compiled-in board id (e.g. `ee02-13in3`, `ee04-7in3`) — same
            string used for the GitHub release asset name and
            firmware_releases.board.
      responses:
        '200':
          description: OK
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '400': { description: version query param or X-Device-Board header is required }
        '404': { description: Unknown firmware version }
        '500': { description: Firmware binary missing from storage }
