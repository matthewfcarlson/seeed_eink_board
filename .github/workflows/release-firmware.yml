name: Release firmware

# Push a tag matching vX.Y.Z (matching FIRMWARE_VERSION in
# firmware/lib/common/version.h — shared by both boards, with a leading 'v')
# to build and publish a GitHub release. The eink-worker Cloudflare Worker
# picks releases up from here — see worker/src/lib/github-release.ts and
# CLAUDE.md's OTA section. It only catalogs the release; rollout to devices is
# a separate, explicit admin action.
#
# Builds both product-firmware environments (ee02-13in3, ee04-7in3) and
# uploads each as a distinctly-named asset (firmware-<board>.bin) on the same
# release, since they share one FIRMWARE_VERSION. Does NOT build
# ee04-7in3-bringup — that's a standalone manual-use environment (display
# driver bring-up only, no OTA client), never part of a release.
# worker/src/lib/github-release.ts's FIRMWARE_ASSET_NAMES map must stay in
# sync with these asset names.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  # softprops/action-gh-release needs this to create the release and generate
  # notes with the default GITHUB_TOKEN — without it the API call 403s with
  # "Resource not accessible by integration" (repo/org default is read-only).
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        working-directory: firmware
        run: pio run -e ee02-13in3 -e ee04-7in3

      - name: Rename build artifacts
        run: |
          cp firmware/.pio/build/ee02-13in3/firmware.bin firmware-ee02-13in3.bin
          cp firmware/.pio/build/ee04-7in3/firmware.bin firmware-ee04-7in3.bin

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware-ee02-13in3.bin
            firmware-ee04-7in3.bin
          generate_release_notes: true
