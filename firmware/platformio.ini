; PlatformIO Project Configuration for Seeed XIAO ePaper boards.
;
; Three firmware images live in this one project, selected by environment:
;   ee02-13in3        - EE02 board + 13.3" Spectra 6 display (dual UC8179
;                        controllers). Full product firmware.
;   ee04-7in3          - EE04 board + 7.3" Six-Color display (single ED2208
;                        controller). Full product firmware, sharing its core
;                        logic with ee02-13in3 via lib/common/ - see
;                        firmware/README.md.
;   ee04-7in3-bringup  - Same board/display as ee04-7in3, but standalone
;                        display-driver bring-up only (test pattern, no
;                        WiFi/OTA) - see firmware/README.md's bring-up
;                        checklist. Useful if hardware issues resurface once
;                        the full app is in place.
;
; Each environment compiles only its own src/<board>/ subdirectory via
; build_src_filter - PlatformIO's src_dir is project-global (not overridable
; per-environment), so this is the supported way to build multiple firmware
; images from one project. Genuinely board-agnostic code (config_manager,
; ble_provisioning, ota_health, the shared device_app.h app core, and the
; single shared version.h) lives in lib/, which *is* project-global and
; automatically available to every environment.
;
;   pio run                       - build all three environments
;   pio run -e ee02-13in3 -t upload
;   pio run -e ee04-7in3 -t upload
;   pio run -e ee04-7in3-bringup -t upload

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; Shared by every environment. NimBLE (not the stock Arduino BLE lib) for
; lower RAM/flash use — see lib/common/ble_provisioning.h/.cpp. Config mode
; only advertises briefly (button-hold triggered), so BLE and WiFi never need
; to run concurrently. Per-environment sections extend this with
; ${env.build_flags} rather than repeating it.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCONFIG_BT_ENABLED
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0

; PlatformIO's Library Dependency Finder compiles lib/common/ as one
; indivisible unit once anything in the project references it at all (it's
; discovered as a single library folder, not per-file), so every environment
; needs these even ee04-7in3-bringup, whose own code path never calls into
; config_manager/ble_provisioning/ota_health.
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    h2zero/NimBLE-Arduino @ ^1.4.1

[env:ee02-13in3]
build_src_filter = +<*> -<ee04>

; ESP32-S3 with PSRAM support - the 960,000-byte frame buffer needs it.
board_build.arduino.memory_type = qio_opi

build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM

[env:ee04-7in3]
build_src_filter = +<*> -<ee02>

; No PSRAM flags: the 192,000-byte buffer (800*480/2) fits comfortably in
; internal SRAM, unlike ee02-13in3's 960,000-byte buffer. This also avoids
; depending on the XIAO ESP32-S3 Plus variant's PSRAM chip being populated.

[env:ee04-7in3-bringup]
build_src_filter = +<*> -<ee02>

build_flags =
    ${env.build_flags}
    -DEE04_BRINGUP_TEST_MODE
